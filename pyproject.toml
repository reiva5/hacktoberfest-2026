[project]
name = "gateway"
version = "0.1.0"
description = "Startup ASEAN gateway: crawl programs and funding calls, extract them with Gemma, match founders."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "trafilatura>=1.12",
    "pydantic>=2.7",
    "pyyaml>=6",
    "pypdf>=4",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
vision = ["pymupdf>=1.24"]
render = ["playwright>=1.44"]
dev = ["pytest>=8"]

[project.scripts]
gateway = "gateway.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
