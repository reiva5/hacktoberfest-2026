name: Task
description: A piece of work for the hackathon build
labels: ["task"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [pipeline, web, contract, docs, demo]
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: P0 = the demo fails without it. P1 = much stronger demo. P2 = only if there's time.
      options: [P0, P1, P2]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What and why
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      placeholder: "- [ ] …"
    validations:
      required: true
